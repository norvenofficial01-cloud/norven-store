<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | NORVEN</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="section container"><div class="split"><h1>Cart</h1><a class="btn" href="index.html">Continue Shopping</a></div><div id="cart-view"></div></main><div id="site-footer"></div><script src="app.js"></script><script>
function renderCart(){let c=cart(),ps=products();if(!c.length){$("#cart-view").innerHTML='<div class="empty">Your cart is empty.</div>';return}let rows=c.map(i=>{let p=ps.find(x=>x.id===i.id);return `<div class="panel" style="margin:12px 0"><div class="split"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · SKU ${esc(p.sku)}</div></div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><span>${i.qty}</span><button onclick="changeQty('${p.id}',1)">+</button></div></div></div>`}).join("");let sub=c.reduce((a,i)=>a+(ps.find(p=>p.id===i.id).price*i.qty),0),ship=sub>=999?0:60;$("#cart-view").innerHTML=`${rows}<div class="panel"><p>Subtotal: <b>${money(sub)}</b></p><p>Shipping: <b>${ship?money(ship):"FREE"}</b></p><h2>Total: ${money(sub+ship)}</h2><div class="actions"><input id="coupon" class="input" placeholder="Coupon code"><button class="btn" onclick="applyCoupon()">Apply Coupon</button><a class="btn primary" href="checkout.html">Checkout</a></div></div>`}function changeQty(id,d){let c=cart(),x=c.find(i=>i.id===id),p=products().find(x=>x.id===id);x.qty=Math.max(0,Math.min(p.stock,x.qty+d));setCart(c.filter(i=>i.qty>0));renderCart()}function applyCoupon(){let code=$("#coupon").value.trim().toUpperCase();let coupons=read(KEYS.coupons,[{code:"NORVEN10",type:"percent",value:10,min_order:0,active:true}]);let c=coupons.find(x=>x.code===code&&x.active);alert(c?`Coupon ${code} applied. Checkout will calculate it.`:"Invalid coupon")}document.addEventListener("DOMContentLoaded",renderCart)
</script></body></html>
