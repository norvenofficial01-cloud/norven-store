<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | NORVEN</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="section container"><h1>Checkout</h1><div class="two"><form class="panel" id="checkout"><div class="formgrid"><input class="input" name="name" placeholder="Customer name" required><input class="input" name="mobile" placeholder="Mobile number" required><input class="input full" name="address" placeholder="Full address" required><input class="input" name="city" placeholder="City" required><input class="input" name="state" placeholder="State" required><input class="input" name="pincode" placeholder="PIN code" required></div><h3>Payment</h3><label><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><br><label><input type="radio" name="pay" value="UPI"> UPI / UPI ID</label><br><label><input type="radio" name="pay" value="QR"> UPI QR</label><div id="pay-box" class="notice" style="margin-top:15px">COD selected.</div><button class="btn primary" style="margin-top:15px">Place Order</button></form><div class="panel"><h2>Order Summary</h2><div id="summary"></div></div></div></main><div id="site-footer"></div><script src="app.js"></script><script>
function summary(){let c=cart(),ps=products(),sub=c.reduce((a,i)=>a+ps.find(p=>p.id===i.id).price*i.qty,0),ship=sub>=999?0:60;$("#summary").innerHTML=`<p>Items: ${c.reduce((a,i)=>a+i.qty,0)}</p><p>Subtotal: ${money(sub)}</p><p>Shipping: ${ship?money(ship):"FREE"}</p><h2>Total: ${money(sub+ship)}</h2>`}function paybox(){let v=document.querySelector("[name=pay]:checked").value;$("#pay-box").innerHTML=v==="COD"?"COD selected.":v==="UPI"?`UPI ID: <b>${esc(read(KEYS.settings,{upi_id:"norven@upi"}).upi_id||"norven@upi")}</b>`:`<p>Scan QR to pay:</p><img src="qr.png" style="width:220px;max-width:100%"><p>After payment, admin will verify the payment reference.</p>`}document.addEventListener("DOMContentLoaded",()=>{summary();paybox();$$("[name=pay]").forEach(x=>x.onchange=paybox);$("#checkout").onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),c=cart(),ps=products(),sub=c.reduce((a,i)=>a+ps.find(p=>p.id===i.id).price*i.qty,0),ship=sub>=999?0:60,order={id:"NV-"+Date.now(),customer_name:fd.get("name"),mobile:fd.get("mobile"),address_line:fd.get("address"),city:fd.get("city"),state:fd.get("state"),pincode:fd.get("pincode"),items:c,total:sub+ship,payment_method:fd.get("pay"),payment_status:fd.get("pay")==="COD"?"pending":"awaiting_verification",order_status:"New",created_at:new Date().toISOString()};let o=read(KEYS.orders,[]);o.unshift(order);write(KEYS.orders,o);setCart([]);location.href="order-confirmation.html?id="+encodeURIComponent(order.id)}})
</script></body></html>
