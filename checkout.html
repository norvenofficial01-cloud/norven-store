<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORVEN Checkout</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><a class="brand" href="index.html">NORVEN</a></header><main class="account"><section class="card"><small>CHECKOUT</small><h1>Complete Order</h1><input id="cn" placeholder="Full name"><input id="cm" placeholder="Mobile"><textarea id="ca" placeholder="Full address"></textarea><input id="cc" placeholder="City"><input id="cp" placeholder="PIN code"><select id="pay"><option>COD</option><option>UPI / QR</option></select><div class="card"><h3>UPI / QR</h3><p class="muted">Put your QR image in this folder as <b>qr.png</b>.</p><img src="qr.png" class="qr" onerror="this.style.display='none'"></div><button class="gold" onclick="placeOrder()">PLACE ORDER</button></section></main><script src="app.js"></script><script>
function placeOrder(){let c=get(CART,[]);if(!c.length)return alert('Cart is empty');let total=c.reduce((a,x)=>a+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);let o={id:'NV'+Date.now(),customer:{name:cn.value,mobile:cm.value,address:ca.value,city:cc.value,pin:cp.value},items:c,total,payment:pay.value,status:'Pending',created:new Date().toISOString()};let os=get(ORD,[]);os.unshift(o);put(ORD,os);put(CART,[]);alert('Order placed: '+o.id);location.href='account.html'}
</script></body></html>
