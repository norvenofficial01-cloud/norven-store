<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORVEN</title>
<style>body{margin:0;font-family:Arial;background:#f5f6f8}.top{background:#111;color:white;padding:12px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;object-fit:contain;background:white;border-radius:8px}.brand{font-size:22px;font-weight:bold;flex:1}.wrap{max-width:1100px;margin:auto;padding:14px}.banner img{width:100%;max-height:300px;object-fit:cover;border-radius:14px}input,textarea,select,button{padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}input,textarea,select{width:100%;margin:6px 0}button{cursor:pointer}.cats{display:flex;gap:8px;overflow:auto;margin:12px 0}.cats button{white-space:nowrap;background:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;padding:10px;border-radius:12px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.add{width:100%;background:#111;color:white}.price{font-weight:bold;margin:6px 0}.box{background:white;padding:16px;border-radius:12px;margin:20px 0}.qr{display:block;max-width:220px;margin:12px auto}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}footer{background:#111;color:#fff;text-align:center;padding:25px}</style></head>
<body><div class="top"><img class="logo" src="logo.png"><div class="brand">NORVEN</div><button onclick="cartView()">🛒 Cart (<span id="count">0</span>)</button></div>
<div class="wrap"><div class="banner"><img src="banner.png"></div><input id="search" placeholder="Search products..." oninput="render()"><div class="cats"><button onclick="cat='All';render()">All</button><button onclick="cat='Clothing';render()">Clothing</button><button onclick="cat='Shoes';render()">Shoes</button><button onclick="cat='Watches';render()">Watches</button><button onclick="cat='Gifts';render()">Gifts</button><button onclick="cat='Home & Kitchen';render()">Home & Kitchen</button><button onclick="cat='Gadgets';render()">Gadgets</button></div>
<div id="products" class="grid"></div>
<div class="box"><h2>Checkout</h2><form onsubmit="order(event)"><input id="nm" placeholder="Name" required><input id="mb" placeholder="Mobile" required><textarea id="ad" placeholder="Full Address" required></textarea><input id="pin" placeholder="PIN Code" required><p>Payment</p><label><input type="radio" name="pay" value="UPI" checked> UPI</label><label><input type="radio" name="pay" value="QR"> QR</label><div id="paybox"></div><button style="width:100%;background:#111;color:#fff">Place Order</button></form></div>
<div class="box"><b>WhatsApp:</b> 7903489053<br><b>Email:</b> norvenofficial01@gmail.com<br><b>UPI:</b> 7903489053@fam</div></div><footer>NORVEN © 2026</footer>
<script>let products=JSON.parse(localStorage.getItem('norven_products')||'[]'),cart=JSON.parse(localStorage.getItem('norven_cart')||'[]'),cat='All';const el=id=>document.getElementById(id);
function render(){let q=el('search').value.toLowerCase(),a=products.filter(p=>(cat==='All'||p.category===cat)&&p.name.toLowerCase().includes(q));el('products').innerHTML=a.length?a.map((p,i)=>'<div class="card"><img src="'+(p.image||'')+'"><b>'+p.name+'</b><div class="price">₹'+p.price+'</div><button class="add" onclick="add('+products.indexOf(p)+')">Add to cart</button></div>').join(''):'<div class="box" style="grid-column:1/-1;text-align:center">No products yet. Add them from admin.html</div>';el('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function add(i){let p=products[i],x=cart.find(x=>x.name===p.name);x?x.qty++:cart.push({name:p.name,price:+p.price,qty:1});localStorage.setItem('norven_cart',JSON.stringify(cart));render()}
function cartView(){alert(cart.length?cart.map(x=>x.name+' × '+x.qty+' = ₹'+x.price*x.qty).join('\n'):'Cart empty')}
function payment(){el('paybox').innerHTML=document.querySelector('input[name=pay]:checked').value==='QR'?'<img class="qr" src="payment-qr.png"><p style="text-align:center">Scan QR to pay.</p>':'<p>UPI ID: <b>7903489053@fam</b></p>'}
document.querySelectorAll('input[name=pay]').forEach(x=>x.onchange=payment);
function order(e){e.preventDefault();if(!cart.length)return alert('Add a product first');let o={id:Date.now(),name:nm.value,mobile:mb.value,address:ad.value,pin:pin.value,payment:document.querySelector('input[name=pay]:checked').value,items:cart,total:cart.reduce((s,x)=>s+x.price*x.qty,0),time:new Date().toLocaleString()};let os=JSON.parse(localStorage.getItem('norven_orders')||'[]');os.push(o);localStorage.setItem('norven_orders',JSON.stringify(os));cart=[];localStorage.setItem('norven_cart','[]');e.target.reset();payment();render();alert('Order saved. Real payment verification is not connected yet.')}
payment();render();</script></body></html>
