<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | NORVEN</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="section container"><h1>My Account</h1><div class="two"><section class="panel"><h2>Profile</h2><form id="profile"><input class="input" name="name" placeholder="Full name"><input class="input" name="phone" placeholder="Mobile" style="margin-top:10px"><button class="btn primary" style="margin-top:10px">Save Profile</button></form><h2>Addresses</h2><div id="addresses"></div><form id="address"><div class="formgrid"><input class="input" name="name" placeholder="Full name" required><input class="input" name="phone" placeholder="Phone" required><input class="input full" name="line" placeholder="Address" required><input class="input" name="city" placeholder="City" required><input class="input" name="state" placeholder="State" required><input class="input" name="pin" placeholder="PIN" required></div><button class="btn" style="margin-top:10px">Add Address</button></form></section><section class="panel"><h2>Order History</h2><div id="orders"></div></section></div></main><div id="site-footer"></div><script src="app.js"></script><script>
function drawAccount(){let p=read(KEYS.profile,{});$("#profile").name.value=p.name||"";$("#profile").phone.value=p.phone||"";let a=read(KEYS.addresses,[]);$("#addresses").innerHTML=a.length?a.map((x,i)=>`<div class="panel" style="margin:8px 0"><b>${esc(x.name)}</b><p>${esc(x.line)}, ${esc(x.city)}, ${esc(x.state)} - ${esc(x.pin)}</p></div>`).join(""):"<p class=muted>No saved addresses.</p>";let o=read(KEYS.orders,[]);$("#orders").innerHTML=o.length?o.map(x=>`<div class="panel" style="margin:8px 0"><b>${esc(x.id)}</b><p>${money(x.total)} · ${esc(x.payment_method)}</p><span class=status>${esc(x.order_status)}</span><details><summary>Order details</summary><p>${esc(x.customer_name)} · ${esc(x.mobile)}</p><p>${esc(x.address_line)}, ${esc(x.city)}, ${esc(x.state)} - ${esc(x.pincode)}</p></details><button class="btn danger" onclick="cancelOrder('${x.id}')">Cancel Order</button></div>`).join(""):"<p class=muted>No orders yet.</p>"}function cancelOrder(id){let o=read(KEYS.orders,[]),x=o.find(y=>y.id===id);if(x&&["New","Confirmed"].includes(x.order_status)){x.order_status="Cancelled";write(KEYS.orders,o);drawAccount()}else alert("This order can no longer be cancelled from customer side.")}document.addEventListener("DOMContentLoaded",()=>{drawAccount();$("#profile").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);write(KEYS.profile,{name:f.get("name"),phone:f.get("phone")});alert("Saved")};$("#address").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=read(KEYS.addresses,[]);a.push({name:f.get("name"),phone:f.get("phone"),line:f.get("line"),city:f.get("city"),state:f.get("state"),pin:f.get("pin")});write(KEYS.addresses,a);e.target.reset();drawAccount()}})</script></body></html>
