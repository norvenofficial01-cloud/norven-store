<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | NORVEN</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="section container"><div class="panel"><h1>Order received ✓</h1><p>Your order has been created.</p><div id="o"></div><div class="actions"><a class="btn primary" href="account.html">View Orders</a><a class="btn" href="index.html">Continue Shopping</a></div></div></main><div id="site-footer"></div><script src="app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let id=new URLSearchParams(location.search).get("id"),o=read(KEYS.orders,[]).find(x=>x.id===id);if(o)$("#o").innerHTML=`<p><b>Order:</b> ${esc(o.id)}</p><p><b>Status:</b> ${esc(o.order_status)}</p><p><b>Total:</b> ${money(o.total)}</p><p><b>Payment:</b> ${esc(o.payment_method)}</p>`})</script></body></html>
