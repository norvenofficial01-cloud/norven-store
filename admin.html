<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORVEN Admin</title><style>body{font-family:Arial;background:#f5f5f5;padding:15px}.box{background:white;padding:15px;border-radius:12px;margin-bottom:15px}input,select,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}button{background:#111;color:white;border:0;border-radius:8px}.order{border-top:1px solid #ddd;padding:12px 0}</style></head><body><h1>NORVEN Admin</h1>
<div class="box"><h2>Add Product</h2><input id="n" placeholder="Product name"><input id="p" type="number" placeholder="Price"><select id="c"><option>Clothing</option><option>Shoes</option><option>Watches</option><option>Gifts</option><option>Home & Kitchen</option><option>Gadgets</option></select><input id="i" placeholder="Image URL or filename"><button onclick="add()">Add Product</button></div><div class="box"><h2>Products</h2><div id="pl"></div></div><div class="box"><h2>Orders</h2><div id="ol"></div></div>
<script>let ps=JSON.parse(localStorage.getItem('norven_products')||'[]');function save(){localStorage.setItem('norven_products',JSON.stringify(ps));render()}function add(){if(!n.value.trim())return alert('Name required');ps.push({name:n.value.trim(),price:+p.value||0,category:c.value,image:i.value.trim()});save();n.value=p.value=i.value=''}function del(x){ps.splice(x,1);save()}function render(){pl.innerHTML=ps.map((x,i)=>x.name+' — ₹'+x.price+' <button onclick="del('+i+')">Delete</button>').join('<br>')||'No products';let os=JSON.parse(localStorage.getItem('norven_orders')||'[]');ol.innerHTML=os.map(o=>'<div class="order"><b>Order #'+o.id+'</b><br>'+o.name+' | '+o.mobile+'<br>'+o.address+', '+o.pin+'<br>'+o.items.map(x=>x.name+' × '+x.qty).join(', ')+'<br>Total ₹'+o.total+' | '+o.payment+'<br>'+o.time+'</div>').join('')||'No orders'}render()</script></body></html>
