<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | NORVEN</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="section container"><div id="product"></div></main><div id="site-footer"></div><script src="app.js"></script><script>
function renderProduct(){let id=new URLSearchParams(location.search).get("id"),p=products().find(x=>x.id===id)||products()[0];if(!p)return;let related=products().filter(x=>x.id!==p.id&&x.category===p.category).slice(0,4);$("#product").innerHTML=`<div class="two"><div><img class="detail-img" src="${esc(img(p))}" alt="${esc(p.name)}"><div class="thumbs">${(p.images||[]).map(x=>`<img src="${esc(x)}">`).join("")}</div>${p.video_url?`<p><a class="btn" target="_blank" href="${esc(p.video_url)}">▶ Product Video</a></p>`:""}</div><div class="panel"><div class="muted">${esc(p.category)} / ${esc(p.subcategory||"")}</div><h1>${esc(p.name)}</h1><div class="stars">★ ${p.rating||0} (${p.reviews_count||0})</div><p><span class="price">${money(p.price)}</span>${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:""}${discount(p)?`<span class="discount">${discount(p)}% OFF</span>`:""}</p><p>${esc(p.description||"")}</p><p><b>SKU:</b> ${esc(p.sku||"-")} · <b>Stock:</b> ${p.stock}</p>${p.sizes?.length?`<p><b>Size</b><br>${p.sizes.map(x=>`<button class="chip" data-size="${esc(x)}">${esc(x)}</button>`).join(" ")}</p>`:""}${p.colors?.length?`<p><b>Color</b><br>${p.colors.map(x=>`<button class="chip" data-color="${esc(x)}">${esc(x)}</button>`).join(" ")}</p>`:""}<div class="actions"><button class="btn primary" onclick="addToCart('${p.id}')">Add to Cart</button><a class="btn" href="cart.html">Go to Cart</a><button class="btn" onclick="toggleWish('${p.id}')">♡ Wishlist</button></div><hr style="border-color:var(--line);margin:24px 0"><h3>Specifications</h3><ul>${Object.entries(p.specifications||{}).map(([k,v])=>`<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join("")}</ul></div></div><section class="section"><h2>Related Products</h2><div class="grid">${related.map(productCard).join("")}</div></section><section class="section"><h2>Ratings & Reviews</h2><div class="panel"><p class="stars">★★★★★</p><p>Verified-purchase reviews with photos/videos are supported. Review moderation is controlled from Admin.</p><button class="btn" onclick="alert('Login and review submission can be connected through Supabase Auth.')">Write a Review</button></div></section>`}document.addEventListener("DOMContentLoaded",renderProduct)
</script></body></html>
